[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "net-audit-report"
version = "0.2.0"
description = "Defensive network vulnerability analyzer for authorized Nmap XML results"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{name = "sundi133"}]
dependencies = []

[project.scripts]
net-audit-report = "net_audit_report.cli:main"

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
